# NOVA 운영 배포 — DB + 백엔드 + 웹(nginx) 을 한 서버에서 띄웁니다.
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
name: nova

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: nova
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?.env.prod 에 POSTGRES_PASSWORD 를 넣어 주세요}
      POSTGRES_DB: nova
    volumes:
      - db-data:/var/lib/postgresql/data
    # 포트를 밖에 열지 않습니다 (백엔드만 내부망으로 접속)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nova -d nova"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  backend:
    build: ./backend
    env_file: .env.prod
    environment:
      DATABASE_URL: postgresql+psycopg://nova:${POSTGRES_PASSWORD}@db:5432/nova
    volumes:
      # 직원이 올린 영수증 사진 (컨테이너를 새로 만들어도 유지)
      - uploads:/app/data/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 10
    restart: unless-stopped

  web:
    build: ./frontend
    # 밖으로 직접 열지 않고 caddy 가 받아서 넘겨 줌
    expose:
      - "80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  # 맨 앞 문지기: SITE_ADDRESS 에 도메인을 넣으면 HTTPS 인증서(Let's Encrypt)를 자동으로 받고 갱신함.
  # 비워 두면 지금처럼 http 로만 동작 (deploy/Caddyfile)
  caddy:
    image: caddy:2.8.4-alpine
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - "${WEB_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data   # 발급받은 인증서 (컨테이너를 새로 만들어도 유지)
      - caddy-config:/config
    depends_on:
      - web
    restart: unless-stopped

volumes:
  db-data:
  uploads:
  caddy-data:
  caddy-config:
