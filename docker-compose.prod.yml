# NOVA 운영 배포 — DB + 백엔드 + 웹(nginx) 을 한 서버에서 띄웁니다.
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
name: nova

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: nova
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?.env.prod 에 POSTGRES_PASSWORD 를 넣어 주세요}
      POSTGRES_DB: nova
    volumes:
      - db-data:/var/lib/postgresql/data
    # 포트를 밖에 열지 않습니다 (백엔드만 내부망으로 접속)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nova -d nova"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  backend:
    build: ./backend
    env_file: .env.prod
    environment:
      DATABASE_URL: postgresql+psycopg://nova:${POSTGRES_PASSWORD}@db:5432/nova
    volumes:
      # 직원이 올린 영수증 사진 (컨테이너를 새로 만들어도 유지)
      - uploads:/app/data/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 10
    restart: unless-stopped

  web:
    build: ./frontend
    ports:
      - "${WEB_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  db-data:
  uploads:
