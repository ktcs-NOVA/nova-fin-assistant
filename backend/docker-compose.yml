# PostgreSQL 16 + pgvector (벡터 검색 확장이 미리 설치된 공식 이미지)
#   켜기:  docker compose up -d
#   끄기:  docker compose down        (데이터는 남음)
#   초기화: docker compose down -v     (데이터까지 삭제)
services:
  db:
    image: pgvector/pgvector:pg16
    container_name: nova-db
    environment:
      POSTGRES_USER: nova
      POSTGRES_PASSWORD: nova
      POSTGRES_DB: nova
      TZ: Asia/Seoul
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - nova-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nova -d nova"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  nova-db-data:
